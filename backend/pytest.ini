[pytest]
; tests/test_main.py does `import db` and `import main` — those modules
; live in this directory, not in tests/. Without this, pytest's default
; "rootless" import mode inserts tests/ itself into sys.path (since
; there's no __init__.py), not this directory, and the imports fail.
pythonpath = .
; test_ask.py has plain `async def test_...` functions with no explicit
; pytest.mark.asyncio — without this they're silently skipped instead
; of run (see PytestUnhandledCoroutineWarning).
asyncio_mode = auto
